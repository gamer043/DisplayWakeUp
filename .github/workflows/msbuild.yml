name: MSBuild

# Every push / PR: build + upload the package as a workflow artifact.
# Tag push (e.g. v1.0.0): also publish a GitHub release (exe, install.ps1, zip).
on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: DisplayWakeUp.sln
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: 'latest'

    - name: Build
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

    - name: Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory dist | Out-Null
        Copy-Item x64/Release/DisplayWakeUp.exe, install.ps1, install.cmd, README.md, LICENSE dist/
        Compress-Archive -Path dist/* -DestinationPath DisplayWakeUp.zip

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: DisplayWakeUp
        path: dist/

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1.16.0
      with:
        artifactErrorsFailBuild: true
        artifacts: "DisplayWakeUp.zip,x64/Release/DisplayWakeUp.exe,install.ps1"
        generateReleaseNotes: true
